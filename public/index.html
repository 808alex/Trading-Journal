<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Trading Journal</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-view="add">Add Trade</button>
      <button class="tab-btn" data-view="list">Trade List</button>
      <button class="tab-btn" data-view="totals">Total P&amp;L</button>
      <button class="tab-btn" data-view="calendar">Calendar</button>
    </nav>
  </header>

  <main>
    <!-- ADD TRADE VIEW -->
    <section id="view-add" class="view active">
      <h2>Log a New Trade</h2>
      <form id="add-trade-form">
        <div class="field">
          <label for="coin_name">Coin name / contract address *</label>
          <input type="text" id="coin_name" name="coin_name" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="entry_price">Entry price</label>
            <input type="number" step="any" id="entry_price" name="entry_price">
          </div>
          <div class="field">
            <label for="entry_mcap">Entry market cap</label>
            <input type="number" step="any" id="entry_mcap" name="entry_mcap">
          </div>
        </div>
        <p class="hint">Fill in at least one: entry price or entry market cap.</p>

        <div class="field-row">
          <div class="field">
            <label for="amount_invested">Amount invested (SOL) *</label>
            <input type="number" step="any" id="amount_invested" name="amount_invested" required>
          </div>
          <div class="field">
            <label for="percent_risked">% of portfolio risked *</label>
            <input type="number" step="any" id="percent_risked" name="percent_risked" required>
          </div>
        </div>

        <div class="field">
          <label for="emotional_state">Emotional state before entering *</label>
          <select id="emotional_state" name="emotional_state" required>
            <option value="" disabled selected>Select one</option>
            <option value="calm">Calm</option>
            <option value="excited">Excited</option>
            <option value="anxious">Anxious</option>
            <option value="bored">Bored</option>
            <option value="fomo">FOMO</option>
          </select>
        </div>

        <div class="field">
          <label for="thesis">Thesis — why are you buying?</label>
          <textarea id="thesis" name="thesis" rows="3" placeholder="Optional now, but required before you can close this trade."></textarea>
        </div>

        <button type="submit" class="btn-primary">Log Trade</button>
        <p id="add-trade-status" class="status-msg"></p>
      </form>
    </section>

    <!-- TRADE LIST VIEW -->
    <section id="view-list" class="view">
      <h2>Trades</h2>
      <div class="filters">
        <label>From <input type="date" id="filter-from"></label>
        <label>To <input type="date" id="filter-to"></label>
        <label>Grade
          <select id="filter-grade">
            <option value="">All</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
        <button id="apply-filters" class="btn-secondary">Apply</button>
        <button id="clear-filters" class="btn-secondary">Clear</button>
      </div>
      <div id="trade-list" class="trade-list"></div>
    </section>

    <!-- TOTALS VIEW -->
    <section id="view-totals" class="view">
      <h2>Total P&amp;L</h2>
      <div id="totals-summary" class="totals-summary"></div>
    </section>

    <!-- CALENDAR VIEW -->
    <section id="view-calendar" class="view">
      <h2>P&amp;L Calendar</h2>
      <div class="calendar-nav">
        <button id="cal-prev" class="btn-secondary">&larr; Prev</button>
        <span id="cal-month-label"></span>
        <button id="cal-next" class="btn-secondary">Next &rarr;</button>
      </div>
      <p id="cal-month-total" class="cal-month-total"></p>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>
  </main>

  <!-- CLOSE / EDIT TRADE MODAL -->
  <div id="trade-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
