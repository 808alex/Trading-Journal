<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>Trading Journal</h1>
    <nav class="tabs">
      <button class="tab-btn active" data-view="add">Log Trade</button>
      <button class="tab-btn" data-view="list">Trade List</button>
      <button class="tab-btn" data-view="totals">Total P&amp;L</button>
      <button class="tab-btn" data-view="calendar">Calendar</button>
    </nav>
  </header>

  <main>
    <!-- ADD / LOG TRADE VIEW -->
    <section id="view-add" class="view active">
      <h2>Log a Trade</h2>
      <p class="hint">Fill in entry details, and exit + reflection too if the trade's already done — no need to come back later.</p>
      <form id="add-trade-form">
        <div class="field-row">
          <div class="field">
            <label for="coin_name">Coin name *</label>
            <input type="text" id="coin_name" name="coin_name" required>
          </div>
          <div class="field">
            <label for="contract_address">Contract address *</label>
            <input type="text" id="contract_address" name="contract_address" required>
          </div>
        </div>

        <div class="field">
          <label>Entry value *</label>
          <div class="value-toggle" data-toggle-group="entry">
            <button type="button" class="toggle-btn active" data-type="mcap">Market Cap</button>
            <button type="button" class="toggle-btn" data-type="price">Price</button>
          </div>
          <input type="text" inputmode="decimal" id="entry_value" placeholder="e.g. 500k, 1.2m, 0.000045" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="amount_invested">Amount invested (SOL) *</label>
            <input type="number" step="any" id="amount_invested" name="amount_invested" required>
          </div>
          <div class="field">
            <label for="percent_risked">% of portfolio risked *</label>
            <input type="number" step="any" id="percent_risked" name="percent_risked" required>
          </div>
        </div>

        <div class="field">
          <label for="emotional_state">Emotional state before entering *</label>
          <select id="emotional_state" name="emotional_state" required>
            <option value="" disabled selected>Select one</option>
            <option value="calm">Calm</option>
            <option value="excited">Excited</option>
            <option value="anxious">Anxious</option>
            <option value="bored">Bored</option>
            <option value="fomo">FOMO</option>
          </select>
        </div>

        <div class="field">
          <label for="thesis">Thesis — why are you buying? <span class="hint-inline">(required to close)</span></label>
          <textarea id="thesis" name="thesis" rows="2"></textarea>
        </div>

        <hr class="section-divider">
        <h3>Exit &amp; Reflection <span class="hint-inline">— trade already done? Fill this in now and close it below.</span></h3>

        <div class="field">
          <label>Exit value</label>
          <div class="value-toggle" data-toggle-group="exit">
            <button type="button" class="toggle-btn active" data-type="mcap">Market Cap</button>
            <button type="button" class="toggle-btn" data-type="price">Price</button>
          </div>
          <input type="text" inputmode="decimal" id="exit_value" placeholder="e.g. 500k, 1.2m, 0.000045">
        </div>

        <div class="field">
          <label for="fees">Fees / gas / tip (SOL)</label>
          <input type="number" step="any" id="fees" name="fees" placeholder="0">
        </div>

        <div class="field">
          <label for="followed_plan">Did you follow your plan?</label>
          <select id="followed_plan" name="followed_plan">
            <option value="">—</option>
            <option value="yes">Yes</option>
            <option value="partially">Partially</option>
            <option value="no">No</option>
          </select>
        </div>

        <div class="field">
          <label for="thoughts_during">Thoughts / emotions during the trade</label>
          <textarea id="thoughts_during" name="thoughts_during" rows="2"></textarea>
        </div>

        <div class="field">
          <label for="lesson_learned">Lesson learned</label>
          <textarea id="lesson_learned" name="lesson_learned" rows="2"></textarea>
        </div>

        <div id="add-grade-guide" class="grade-guide"></div>
        <div class="field">
          <label for="grade">Grade (process quality, not P&amp;L)</label>
          <select id="grade" name="grade">
            <option value="">—</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </div>

        <div class="form-actions">
          <button type="submit" id="save-open-btn" class="btn-secondary" data-status="open">Save as Open</button>
          <button type="submit" id="save-closed-btn" class="btn-primary" data-status="closed">Log &amp; Close Trade</button>
        </div>
        <p id="add-trade-status" class="status-msg"></p>
      </form>
    </section>

    <!-- TRADE LIST VIEW -->
    <section id="view-list" class="view">
      <h2>Trades</h2>
      <div class="filters">
        <label>Search <input type="text" id="filter-search" placeholder="Coin name or address"></label>
        <label>From <input type="date" id="filter-from"></label>
        <label>To <input type="date" id="filter-to"></label>
        <label>Grade
          <select id="filter-grade">
            <option value="">All</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
            <option value="D">D</option>
          </select>
        </label>
        <label>Sort (closed)
          <select id="filter-sort">
            <option value="date">Newest first</option>
            <option value="profit">Biggest profit</option>
            <option value="loss">Biggest loss</option>
          </select>
        </label>
        <button id="clear-filters" class="btn-secondary">Clear</button>
      </div>
      <p id="trade-list-error" class="status-msg error hidden"></p>

      <h3>Open Positions</h3>
      <div id="open-trade-list" class="trade-list"></div>

      <h3>Closed Positions</h3>
      <div id="closed-trade-list" class="trade-list"></div>
    </section>

    <!-- TOTALS VIEW -->
    <section id="view-totals" class="view">
      <h2>Total P&amp;L</h2>
      <p id="totals-error" class="status-msg error hidden"></p>
      <div id="totals-summary" class="totals-summary"></div>
    </section>

    <!-- CALENDAR VIEW -->
    <section id="view-calendar" class="view">
      <h2>P&amp;L Calendar</h2>
      <div class="calendar-nav">
        <button id="cal-prev" class="btn-secondary">&larr; Prev</button>
        <span id="cal-month-label"></span>
        <button id="cal-next" class="btn-secondary">Next &rarr;</button>
        <div class="value-toggle" data-toggle-group="cal-currency">
          <button type="button" class="toggle-btn active" data-type="sol">SOL</button>
          <button type="button" class="toggle-btn" data-type="usd">USD</button>
        </div>
        <input type="number" step="any" id="sol-price-usd" placeholder="SOL price in $" class="sol-price-input hidden">
      </div>
      <p id="cal-month-total" class="cal-month-total"></p>
      <p id="calendar-error" class="status-msg error hidden"></p>
      <div id="calendar-grid" class="calendar-grid"></div>
    </section>
  </main>

  <!-- CLOSE / EDIT TRADE MODAL -->
  <div id="trade-modal" class="modal hidden">
    <div class="modal-content">
      <button id="modal-close" class="modal-close-btn">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
